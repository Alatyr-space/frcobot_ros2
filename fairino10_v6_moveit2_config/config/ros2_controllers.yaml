# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    fairino10_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fairino10_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6
    command_interfaces:
      - position
    state_interfaces:
      - position
    # F-226 (AN-007): with no constraints the controller checked no
    # tolerance, so a goal the arm never followed (ServoJ refused, the arm
    # still) was reported reached. The goal tolerance catches an arm that did
    # not arrive -- not an accuracy gate; the path (trajectory) tolerance
    # aborts mid-move, which keeps a refused move short. After an abort the
    # controller holds the measured position (open_loop_control and
    # interpolate_from_desired_state false). Bench numbers, radians, set
    # 2026-10-12; the bench repository's contract test holds them.
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.01
      j1: {trajectory: 0.05, goal: 0.005}
      j2: {trajectory: 0.05, goal: 0.005}
      j3: {trajectory: 0.05, goal: 0.005}
      j4: {trajectory: 0.05, goal: 0.005}
      j5: {trajectory: 0.05, goal: 0.005}
      j6: {trajectory: 0.05, goal: 0.005}
